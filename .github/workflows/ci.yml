name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # `claude plugin validate` reads local files only - no account, no API key.
      - name: Validate the marketplace catalog
        run: claude plugin validate .

      - name: Validate the plugin manifest, hooks module and state contract
        run: claude plugin validate ./plugins/vero-diff

      - name: Validate again, warnings as errors
        run: claude plugin validate . --strict

      # The pane's TypeScript, run against the engine itself: no account, no API key.
      - name: Test the hooks module
        run: claude plugin test ./plugins/vero-diff

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse every script
        run: |
          for f in install.sh uninstall.sh tests/smoke.sh \
                   plugins/vero-diff/scripts/snapshot.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -s bash -S warning \
            install.sh uninstall.sh tests/smoke.sh \
            plugins/vero-diff/scripts/snapshot.sh

  smoke:
    # macOS is not decoration: snapshot.sh picks `md5 -q` over `md5sum` there, and that
    # branch never runs on a Linux developer machine.
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Run the smoke test
        run: tests/smoke.sh

  endings:
    name: Line endings and permissions
    runs-on: ubuntu-latest
    steps:
      # A clone with core.autocrlf=true is what a Windows user gets. Without
      # .gitattributes it hands them scripts that die on "/usr/bin/env: 'bash\r'".
      - name: Clone the way a Windows user would
        run: git -c core.autocrlf=true clone --depth 1 "${{ github.server_url }}/${{ github.repository }}" checkout

      - name: No CRLF reached the working tree
        working-directory: checkout
        run: |
          bad=0
          for f in install.sh uninstall.sh tests/smoke.sh \
                   plugins/vero-diff/scripts/snapshot.sh; do
            if grep -q $'\r$' "$f"; then echo "CRLF in $f"; bad=1; else echo "LF ok: $f"; fi
            if [ ! -x "$f" ]; then echo "not executable: $f"; bad=1; fi
          done
          exit "$bad"

      # Outside a git repository the hook has nothing to snapshot and must still exit 0.
      - name: The snapshot hook actually runs from that clone
        working-directory: checkout
        run: CLAUDE_PROJECT_DIR=/ ./plugins/vero-diff/scripts/snapshot.sh pre </dev/null
